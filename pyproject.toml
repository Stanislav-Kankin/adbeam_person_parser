[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adbeam-person-parser"
version = "0.1.0"
description = "Local B2B contact enrichment pipeline for Kontur Excel exports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "pydantic>=2.8,<3",
    "selectolax>=0.3.21,<1",
    "tenacity>=8.2,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
]
build = [
    "pyinstaller>=6.10,<7",
]

[project.gui-scripts]
adbeam-person-parser = "lead_enrichment.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["lead_enrichment"]
